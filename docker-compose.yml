version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: billing_db
    environment:
      POSTGRES_DB: subscription_billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./src/infrastructure/database/init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./src/infrastructure/database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing_api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/subscription_billing
      PAYMENT_MOCK_SUCCESS: "true"
    depends_on:
      db:
        condition: service_healthy
